<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1200px;height:675px;overflow:hidden;background:#FFFAF3;
  font-family:"Microsoft YaHei","PingFang SC","Hiragino Sans GB",sans-serif;color:#181410;
  position:relative;display:flex}
.bg{position:absolute;inset:0;
  background:radial-gradient(760px 420px at 4% -10%,rgba(255,199,44,.34),transparent 62%)}
.left{width:772px;padding:54px 0 54px 60px;display:flex;flex-direction:column;position:relative;z-index:2}
.brand{display:flex;align-items:center;gap:13px}
.logo{width:48px;height:48px;border-radius:14px;background:#DA291C;display:grid;place-items:center;
  color:#FFC72C;font-size:28px;font-weight:900;flex:none}
.brand .t1{font-size:21px;font-weight:800;letter-spacing:-.01em}
.brand .t2{font-size:14.5px;color:#8B8177;margin-top:1px}
h1{font-size:55px;line-height:1.18;font-weight:900;letter-spacing:-.04em;margin-top:34px}
h1 em{font-style:normal;background:#FFC72C;padding:1px 12px;border-radius:9px;display:inline-block;
  transform:rotate(-1deg)}
.sub{font-size:19px;line-height:1.6;color:#5A524A;margin-top:20px;font-weight:600;max-width:640px}
.sub b{color:#DA291C}
.data{margin-top:26px;display:flex;align-items:center;gap:20px;
  background:#fff;border:1px solid #F0E6D8;border-radius:16px;padding:18px 24px;
  box-shadow:0 6px 20px rgba(24,20,16,.06);width:fit-content}
.d-blk .lb{font-size:13px;color:#8B8177;font-weight:600}
.d-blk .v{font-size:38px;font-weight:900;letter-spacing:-.03em;line-height:1.15;
  font-variant-numeric:tabular-nums}
.d-blk.base .v{color:#8B8177;text-decoration:line-through;text-decoration-thickness:2.5px}
.d-blk.fin .v{color:#DA291C}
.d-ar{font-size:28px;color:#C4B8A8}
.d-save{background:#1E8E4E;color:#fff;border-radius:11px;padding:9px 17px;text-align:center;flex:none}
.d-save .v{font-size:23px;font-weight:900;line-height:1.15}
.d-save .lb{font-size:11.5px;opacity:.92}
.finds{margin-top:auto;display:flex;flex-direction:column;gap:9px}
.fi{display:flex;gap:10px;align-items:flex-start;font-size:15px;color:#5A524A;font-weight:600}
.fi .n{background:#FFC72C;color:#181410;width:22px;height:22px;border-radius:7px;flex:none;
  display:grid;place-items:center;font-size:13px;font-weight:900;margin-top:1px}
.fi b{color:#181410}
.right{flex:1;background:#DA291C;position:relative;overflow:hidden;
  display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 42px;color:#fff}
.right .glow{position:absolute;inset:0;
  background:radial-gradient(430px 380px at 24% 6%,rgba(255,199,44,.46),transparent 64%),
             radial-gradient(420px 380px at 90% 98%,rgba(255,199,44,.24),transparent 62%)}
.right>*{position:relative}
.qr-wrap{background:#fff;border-radius:20px;padding:14px;box-shadow:0 12px 34px rgba(0,0,0,.22)}
.qr-wrap img{width:206px;height:206px;display:block}
.qr-tip{font-size:20px;font-weight:800;margin-top:18px;text-align:center;letter-spacing:-.01em}
.qr-sub{font-size:14px;opacity:.9;margin-top:7px;text-align:center;font-weight:600;line-height:1.5}
.star{margin-top:20px;background:#FFC72C;color:#DA291C;border-radius:999px;padding:11px 26px;
  font-size:19px;font-weight:900;display:flex;align-items:center;gap:9px}
</style></head>
<body>
<div class="bg"></div>
<div class="left">
  <div class="brand">
    <div class="logo">M</div>
    <div>
      <div class="t1">麦麦省钱助手 mcd-saver</div>
      <div class="t2">基于麦当劳中国官方 MCP 的省钱决策 Skill</div>
    </div>
  </div>

  <h1>点麦当劳<br><em>怎么买最省？</em></h1>

  <p class="sub">给它想吃的和预算，它<b>领光所有券、试算全部组合</b>，<br>告诉你最低实付是多少。</p>

  <div class="data">
    <div class="d-blk base"><div class="lb">不用券基准</div><div class="v">¥57.70</div></div>
    <div class="d-ar">→</div>
    <div class="d-blk fin"><div class="lb">官方引擎试算实付</div><div class="v">¥55.70</div></div>
    <div class="d-save"><div class="v">省 ¥2.00</div><div class="lb">真实账号跑通</div></div>
  </div>

  <div class="finds">
    <div class="fi"><span class="n">1</span><span>可领券<b>没有 ID</b>，得先领进券包才能下单</span></div>
    <div class="fi"><span class="n">2</span><span>券包里的券<b>不代表这家店能用</b>——这才是"有券用不掉"的原因</span></div>
    <div class="fi"><span class="n">3</span><span>券可能<b>"未到使用时间"</b>，只有标签里写了，看日期会漏</span></div>
  </div>
</div>

<div class="right">
  <div class="glow"></div>
  <div class="qr-wrap"><img src="qrcode.png" alt="GitHub 仓库二维码"></div>
  <div class="qr-tip">手机扫码直达开源仓库</div>
  <div class="qr-sub">github.com/huangtianyu-shen/mcd-saver<br>零依赖 Python · MIT 开源</div>
  <div class="star">★ Star</div>
</div>
</body></html>
